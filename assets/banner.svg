<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
  <title id="title">Shivansh Sharma, Developer File</title>
  <defs>
    <clipPath id="card"><rect width="1200" height="300" rx="16"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" fill-opacity="0.025"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD400" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFD400" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFD400" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFD400" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#0A0A0A"/>
    <rect width="1200" height="300" fill="url(#scan)"/>
    <rect width="1200" height="5" fill="#FFD400"/>

    <!-- The signal: a terminal prompt in the sky instead of a logo -->
    <polygon points="1020,300 1060,300 1048,150 952,150" fill="url(#beam)"/>
    <ellipse cx="1000" cy="118" rx="150" ry="110" fill="url(#glow)"/>
    <ellipse cx="1000" cy="118" rx="74" ry="46" fill="#FFD400"/>
    <text x="1000" y="133" text-anchor="middle" fill="#0A0A0A"
          font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace"
          font-size="42" font-weight="700">&gt;_</text>

    <!-- Gotham skyline -->
    <path fill="#141414" d="M0 300V262h38v-14h26v14h20v-34h34v34h18v-22h30v22h22v-48h12v-10h22v10h12v48h26v-26h40v26h18v-18h28v18h30v-40h36v40h20v-28h24v28h26v-12h30v12h18v-56h14v-12h20v12h14v56h28v-30h34v30h22v-20h26v20h30v-44h40v44h24v-16h28v16h20v-36h18v-18h16v18h18v36h26v-24h36v24h22v-62h30v62h28v-30h38v30h24v-14h30v14h22v-46h34v46h36v-22h28v22h20V300z"/>
    <g fill="#FFD400" fill-opacity="0.35">
      <rect x="210" y="262" width="3" height="4"/>
      <rect x="226" y="276" width="3" height="4"/>
      <rect x="572" y="250" width="3" height="4"/>
      <rect x="590" y="268" width="3" height="4"/>
      <rect x="866" y="282" width="3" height="4"/>
      <rect x="902" y="262" width="3" height="4"/>
      <rect x="1062" y="256" width="3" height="4"/>
      <rect x="1080" y="272" width="3" height="4"/>
    </g>

    <!-- Text -->
    <text x="58" y="78" fill="#FFD400"
          font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace"
          font-size="15" font-weight="700" letter-spacing="3">&gt;<tspan>_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan> GOTHAM // DEVELOPER FILE</text>
    <text x="54" y="150" fill="#F5F5F5"
          font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="66" font-weight="800" letter-spacing="1">SHIVANSH SHARMA</text>
    <text x="58" y="190" fill="#9A9A9A"
          font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace"
          font-size="15" letter-spacing="2.5">FULL-STACK DEVELOPER · AI SYSTEMS · NSUT '27</text>
  </g>
</svg>
